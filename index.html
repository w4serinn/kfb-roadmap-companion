<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kfb-roadmap-companion</title>
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
<header class="site-header">
  <p class="site-header__eyebrow">Kawaii Future Bass 作曲学習ロードマップ</p>
  <h1 class="site-header__title">kfb-roadmap-companion</h1>
  <p class="site-header__tagline">1年計画を走り切るための、継続と理解の橋渡し役。</p>
</header>

<main id="app">
  <section id="overall-progress" class="overall-progress"></section>

    <p class="month-list__status">読み込み中…</p>
  </section>
</main>

<footer class="site-footer">
  <p>音楽制作アプリの代替ではなく、継続の支援ツールです。</p>
  <button id="export-progress-button" type="button" class="export-button">
    進捗データをエクスポート
  </button>
</footer>

<script type="module" src="assets/main.js"></script>
</body>
</html>
